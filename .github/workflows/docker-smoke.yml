name: Docker smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and test isolated production images
        run: node deploy/smoke.mjs

      # Normally finally has already removed the project. Also covers a canceled
      # step after the script wrote the record path to GITHUB_ENV.
      - name: Verify cleanup of only this run's resources
        if: always() && env.FEEDRELAY_SMOKE_RECORD != ''
        timeout-minutes: 3
        run: node deploy/smoke.mjs --cleanup-record "$FEEDRELAY_SMOKE_RECORD"

      - name: Preserve smoke results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            work/deploy-smoke/*/results.json
            work/deploy-smoke/*/commands.log
            work/deploy-smoke/*/runtime.log
