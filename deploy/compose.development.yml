name: feedrelay-development
services:
  # Optional Linux demo container. Native `pnpm dev` works on Windows/macOS too.
  # Host networking preserves the application's mandatory loopback bindings.
  demo:
    profiles: [demo]
    build:
      context: ..
      dockerfile: deploy/dev.Dockerfile
    network_mode: host
    environment:
      MODE: demo
      ROLE: all
      NODE_ENV: development
      HOST: 127.0.0.1
      PORT: 4100
      PUBLIC_URL: http://localhost:3000
      API_BASE: http://127.0.0.1:4100
      BILLING_ENABLED: 'false'
      DEMO_DATA_PATH: .data/demo.json
      NEXT_TELEMETRY_DISABLED: '1'
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [demo_data:/app/apps/server/.data]

  # PostgreSQL for integration work; it is optional for the memory demo.
  postgres:
    profiles: [database]
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: feedrelay_dev
      POSTGRES_USER: feedrelay_dev
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports: ['127.0.0.1:5432:5432']
    volumes: [development_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
volumes:
  demo_data: {}
  development_postgres_data: {}
